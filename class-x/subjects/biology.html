const BOOK=[{"chapter": 1, "section": "1.1", "title": "Types of cells", "page": "2", "model": "cell", "idea": "All living things are made of cells. Some cells have a nucleus and many organelles, while others have no true nucleus.", "points": ["A cell is the smallest living unit", "A eukaryotic cell has DNA inside a nucleus", "A prokaryotic cell has DNA in a nucleoid region"], "example": "Compare a cheek cell and a bacterium: both live, but they organize DNA differently.", "question": "Which type of cell has a membrane-bound nucleus?", "answer": "Eukaryotic cells. Bacteria are prokaryotic and do not have a true nucleus."}, {"chapter": 1, "section": "1.1", "title": "Eukaryotic cell structures", "page": "2", "model": "cell", "idea": "In eukaryotic cells, different parts do different jobs, just like departments in a school.", "points": ["The nucleus holds genetic instructions", "Mitochondria release usable energy in respiration", "The cell membrane controls entry and exit"], "example": "The nucleus is like an instruction office; the membrane is like a school gate.", "question": "What is the main role of mitochondria?", "answer": "They release energy from nutrients through cellular respiration, helping the cell make ATP."}, {"chapter": 1, "section": "1.1", "title": "Prokaryotic cells and their parts", "page": "3", "model": "cell", "idea": "Bacteria are examples of prokaryotes. Their DNA is not enclosed in a nucleus, but they still carry out life processes.", "points": ["Cell wall gives shape and protection", "Ribosomes make proteins", "Flagella in some bacteria help movement"], "example": "A bacterium can swim with a flagellum but has no membrane-bound nucleus.", "question": "Do all bacteria contain a nucleus?", "answer": "No. Their DNA occupies a nucleoid region, without a nuclear envelope."}, {"chapter": 1, "section": "1.1", "title": "Prokaryotes versus eukaryotes", "page": "5", "model": "cell", "idea": "The simplest distinction is whether the cell has a proper nucleus and membrane-bound organelles.", "points": ["Both have cell membranes and genetic material", "Only eukaryotes have membrane-bound organelles", "Bacteria are prokaryotes, while plants and animals are eukaryotes"], "example": "Compare a bacterial cell with a leaf cell.", "question": "Name one structure present in both types of cells.", "answer": "Both have a cell membrane and ribosomes, even though their internal organization differs."}, {"chapter": 1, "section": "1.2", "title": "The cell membrane", "page": "7", "model": "transport", "idea": "The cell membrane is a thin, selectively permeable boundary. It allows some substances across more easily than others.", "points": ["It is mainly a phospholipid bilayer", "Membrane proteins act as channels or carriers", "Selective permeability helps maintain stable conditions"], "example": "Water crosses a cell membrane more readily than many large dissolved molecules.", "question": "What does selectively permeable mean?", "answer": "It means the membrane lets certain substances pass while restricting others."}, {"chapter": 1, "section": "1.2", "title": "Diffusion", "page": "8", "model": "transport", "idea": "Particles naturally spread from a crowded region to a less crowded region. This is diffusion.", "points": ["Diffusion follows a concentration gradient", "It does not need energy from ATP", "Particles keep moving randomly"], "example": "A drop of ink gradually spreads throughout water.", "question": "Does diffusion need ATP?", "answer": "No. It is a passive process driven by random movement and concentration differences."}, {"chapter": 1, "section": "1.2", "title": "Osmosis", "page": "9", "model": "transport", "idea": "Osmosis is the net movement of water through a selectively permeable membrane from higher water potential to lower water potential.", "points": ["It involves water", "A selectively permeable membrane is required", "A solution with more dissolved solute often has lower water potential"], "example": "A potato cup filled with sugar solution can draw in water.", "question": "Which substance moves during osmosis?", "answer": "Water molecules move through the selectively permeable membrane."}, {"chapter": 1, "section": "1.2", "title": "Hypertonic, hypotonic and isotonic", "page": "11", "model": "transport", "idea": "The surrounding solution affects whether a cell gains or loses water.", "points": ["Hypertonic surroundings cause net water loss", "Hypotonic surroundings cause net water gain", "Isotonic surroundings give no net water movement"], "example": "A plant cell may become plasmolysed when kept in concentrated salt solution.", "question": "What happens to a plant cell in a hypertonic solution?", "answer": "Water leaves by osmosis, and the cell contents may shrink away from the cell wall (plasmolysis)."}, {"chapter": 1, "section": "1.2", "title": "Active transport", "page": "12", "model": "transport", "idea": "Sometimes a cell must move substances against their concentration gradient, from less crowded to more crowded.", "points": ["Active transport needs energy, usually from ATP", "Carrier proteins help transfer substances", "Root cells can take up mineral ions this way"], "example": "Root hairs can absorb mineral ions even when the soil solution contains fewer ions than the root cell.", "question": "Why is active transport different from diffusion?", "answer": "Active transport requires energy and can move substances against their concentration gradient."}, {"chapter": 1, "section": "1.3", "title": "Mitosis and its stages", "page": "14", "model": "division", "idea": "Mitosis makes two genetically identical daughter cells. It helps organisms grow and replace damaged cells.", "points": ["DNA is copied before mitosis", "Chromosomes line up and separate", "Each daughter cell receives the same chromosome number"], "example": "Skin cells divide by mitosis when a cut heals.", "question": "How many cells are produced in one mitotic division?", "answer": "Two daughter cells that normally have the same chromosome number as the parent cell."}, {"chapter": 1, "section": "1.3", "title": "Significance of mitosis", "page": "16", "model": "division", "idea": "Mitosis makes more body cells while keeping their genetic information the same.", "points": ["Used for growth", "Used for repair and replacement", "Used in some types of asexual reproduction"], "example": "Healing a scrape requires replacement of damaged cells.", "question": "Why is mitosis important for growth?", "answer": "It increases the number of body cells without halving their chromosomes."}, {"chapter": 1, "section": "1.3", "title": "Meiosis and its stages", "page": "17", "model": "division", "idea": "Meiosis produces cells with half the usual chromosome number, used for sexual reproduction.", "points": ["One DNA replication is followed by two divisions", "Homologous chromosomes separate in meiosis I", "Sister chromatids separate in meiosis II"], "example": "Sperm and egg formation involves meiosis.", "question": "How many daughter cells normally result from meiosis?", "answer": "Four haploid daughter cells, each having half the chromosome number of the starting diploid cell."}, {"chapter": 1, "section": "1.3", "title": "Mitosis compared with meiosis", "page": "20", "model": "division", "idea": "Both divide nuclei, but they serve different purposes.", "points": ["Mitosis normally gives two identical cells", "Meiosis normally gives four genetically varied haploid cells", "Meiosis helps create genetic variation"], "example": "Body growth uses mitosis, while formation of gametes uses meiosis.", "question": "Why is meiosis essential in sexual reproduction?", "answer": "It halves the chromosome number so fertilization can restore the species' normal diploid number."}, {"chapter": 2, "section": "2.1", "title": "Photosynthesis overview", "page": "30", "model": "photo", "idea": "Green plants make glucose using light energy, carbon dioxide and water; oxygen is released.", "points": ["Chlorophyll absorbs light", "Photosynthesis stores energy in sugars", "Oxygen is produced as a by-product of splitting water"], "example": "An aquatic plant may release oxygen bubbles in bright light.", "question": "Write the word equation for photosynthesis.", "answer": "Carbon dioxide + water → glucose + oxygen, in the presence of light and chlorophyll."}, {"chapter": 2, "section": "2.1", "title": "Light reaction", "page": "30", "model": "photo", "idea": "The light-dependent reaction happens in thylakoid membranes. Light energy helps split water and make energy-carrying molecules.", "points": ["Light is absorbed by photosystems", "Water splitting releases oxygen", "ATP and NADPH are produced"], "example": "Bright light powers the first stage of photosynthesis.", "question": "Where does the oxygen from photosynthesis come from?", "answer": "It comes from water molecules split in the light-dependent reaction."}, {"chapter": 2, "section": "2.1", "title": "Dark reaction / Calvin cycle", "page": "32", "model": "photo", "idea": "The light-independent reactions use CO₂ and energy carried by ATP and NADPH to build carbohydrates. They do not require darkness.", "points": ["CO₂ is fixed into organic molecules", "ATP and NADPH from light reactions are used", "These reactions operate when their required substances are available"], "example": "A plant uses energy made by light reactions to make sugars.", "question": "Does the 'dark reaction' occur only at night?", "answer": "No. It does not directly require light, but often proceeds in daylight when ATP and NADPH are supplied."}, {"chapter": 2, "section": "2.1", "title": "Photosystems", "page": "33", "model": "photo", "idea": "Photosystems are groups of pigments and proteins that capture light in the thylakoid membrane.", "points": ["Photosystem II helps start electron flow", "Photosystem I helps form NADPH", "Light energy drives the electron transport process"], "example": "Imagine solar panels passing energy through a chain of steps.", "question": "What do photosystems absorb?", "answer": "Light energy, mainly through chlorophyll and other pigments."}, {"chapter": 2, "section": "2.1", "title": "Factors affecting photosynthesis", "page": "34", "model": "photo", "idea": "The speed of photosynthesis depends on available light, carbon dioxide, temperature and the condition of the plant.", "points": ["More light helps until something else limits the rate", "CO₂ may be a limiting factor", "Very high temperature can damage enzymes"], "example": "A plant under a lamp may make oxygen faster as the lamp moves closer, up to a limit.", "question": "Why can a brighter lamp stop increasing photosynthesis?", "answer": "Because CO₂, temperature, or another factor may become limiting."}, {"chapter": 2, "section": "2.1", "title": "Blackman's law of limiting factors", "page": "37", "model": "photo", "idea": "The slowest supply or least favourable condition can limit the total rate of photosynthesis.", "points": ["The limiting factor sets the maximum rate at that moment", "Improving a non-limiting factor may change little", "The limiting factor can change as conditions change"], "example": "Watering a plant more will not overcome a shortage of light.", "question": "What does a limiting factor do?", "answer": "It prevents the process from becoming faster until that limiting factor is improved."}, {"chapter": 2, "section": "2.1", "title": "Utilization of photosynthetic products", "page": "37", "model": "photo", "idea": "Plants use produced sugars to obtain energy and to build other important substances.", "points": ["Glucose is used in respiration", "Glucose can be stored as starch", "Sugars also help make cellulose and other compounds"], "example": "A growing plant turns some sugars into strong cell walls.", "question": "Name two uses of glucose in plants.", "answer": "It provides energy in respiration and can be changed into starch for storage."}, {"chapter": 2, "section": "2.2", "title": "Xylem and water movement", "page": "39", "model": "plant", "idea": "Xylem vessels transport water and dissolved mineral ions mainly upward from roots to leaves.", "points": ["Root hairs absorb water", "Xylem provides a continuous transport path", "Transpiration helps pull water up"], "example": "Water absorbed by a root eventually reaches leaves through xylem.", "question": "What travels mainly in xylem?", "answer": "Water and dissolved mineral ions, largely from roots toward the upper parts of the plant."}, {"chapter": 2, "section": "2.2", "title": "Phloem and food transport", "page": "40", "model": "plant", "idea": "Phloem moves dissolved sugars and other organic substances from sources to sinks.", "points": ["A source makes or releases sugars", "A sink uses or stores sugars", "Phloem movement can be upward or downward"], "example": "A leaf can send sugars to a root or a growing fruit.", "question": "Can food move down a plant through phloem?", "answer": "Yes. Phloem moves food from a source to a sink, which may be above or below the source."}, {"chapter": 2, "section": "2.2", "title": "Translocation and ring experiment", "page": "40", "model": "plant", "idea": "Translocation is the transport of organic food through phloem. Removing a ring of bark can interrupt this movement.", "points": ["Phloem often lies near the bark", "A ring can block sugar movement", "Food may build up above the removed ring"], "example": "A swelling may form above a ringed stem because sugars accumulate there.", "question": "What does the ring experiment help demonstrate?", "answer": "It shows that phloem in the bark transports organic food materials."}, {"chapter": 2, "section": "2.2", "title": "Pressure-flow hypothesis", "page": "41", "model": "plant", "idea": "Sugar loading into phloem draws in water, increasing pressure. Sap then moves toward a lower-pressure sink.", "points": ["Sugar is loaded into a source region", "Water enters by osmosis and raises pressure", "Sap moves through sieve tubes toward sinks"], "example": "Think of a water-filled tube pushed from one end by pressure.", "question": "Why does water enter phloem near a sugar source?", "answer": "The dissolved sugar lowers water potential, drawing in water by osmosis."}, {"chapter": 2, "section": "2.2", "title": "Mineral nutrient absorption", "page": "42", "model": "plant", "idea": "Plants get mineral ions such as nitrate and potassium from soil through root tissues.", "points": ["Mineral ions dissolve in soil water", "Root hairs increase the absorbing surface", "Some ions require active transport"], "example": "Roots absorb nitrate used in making proteins.", "question": "Why are root hairs useful?", "answer": "Their large surface area helps absorb water and mineral ions from the soil."}, {"chapter": 2, "section": "2.2", "title": "Ion-exchange, mass flow and Donnan equilibrium", "page": "43", "model": "plant", "idea": "The textbook discusses several ways to explain how minerals reach and enter roots.", "points": ["Mass flow carries ions with water toward roots", "Ion exchange involves charged ions at surfaces", "Donnan effects relate to unequal ion distribution near charged membranes"], "example": "Water moving toward roots can carry dissolved nutrients along with it.", "question": "What is mass flow in root nutrition?", "answer": "Mineral ions are carried with the bulk movement of water toward the roots."}, {"chapter": 2, "section": "2.3", "title": "Plant hormones: auxins and others", "page": "45", "model": "tropism", "idea": "Plant hormones are chemical messengers that control growth, development and responses to the environment.", "points": ["Auxin influences cell elongation", "Gibberellins can promote stem growth", "Ethylene can help fruits ripen"], "example": "A plant shoot often bends toward light.", "question": "What is a plant hormone?", "answer": "A naturally produced chemical messenger that regulates plant growth or responses."}, {"chapter": 2, "section": "2.3", "title": "Interaction of plant hormones", "page": "46", "model": "tropism", "idea": "Plant growth depends on several hormones working together, not just one hormone.", "points": ["Hormones may promote or inhibit a process", "The effect depends on tissue and dose", "Light and gravity influence responses"], "example": "Auxin distribution in a shoot can help the shoot bend toward a light source.", "question": "Why do hormones sometimes have different effects?", "answer": "Their effects depend on concentration, the kind of tissue and other signals."}, {"chapter": 2, "section": "2.3", "title": "Commercial uses of plant hormones", "page": "47", "model": "tropism", "idea": "People use plant-growth substances in horticulture, including rooting cuttings and controlling fruit development.", "points": ["Auxin products can promote root formation", "Some hormones influence ripening", "Growth regulators must be used at suitable doses"], "example": "A cutting may develop roots after treatment with a rooting product.", "question": "Why are rooting powders used?", "answer": "They contain growth regulators that encourage roots to form on plant cuttings."}, {"chapter": 3, "section": "3.1", "title": "Digestion and enzymes", "page": "55", "model": "digest", "idea": "Digestion breaks large food molecules into smaller soluble molecules the body can absorb.", "points": ["Mechanical digestion breaks food physically", "Enzymes speed up chemical digestion", "Different enzymes act on different food groups"], "example": "Amylase helps break starch into smaller sugars.", "question": "Why is chemical digestion needed?", "answer": "Large food molecules often cannot be absorbed until enzymes break them into smaller soluble units."}, {"chapter": 3, "section": "3.1", "title": "Digestion in the mouth", "page": "56", "model": "digest", "idea": "Teeth chew food and saliva begins the chemical digestion of starch.", "points": ["Chewing increases surface area", "Saliva moistens the food", "Salivary amylase begins starch breakdown"], "example": "Chew a piece of rice well: its starch begins being digested.", "question": "Which enzyme is found in saliva?", "answer": "Salivary amylase, which starts the digestion of starch."}, {"chapter": 3, "section": "3.1", "title": "Digestion in the stomach", "page": "56", "model": "digest", "idea": "The stomach mixes food and releases acid and enzymes that begin breaking down proteins.", "points": ["Hydrochloric acid creates acidic conditions", "Pepsin digests proteins", "Mucus protects the stomach lining"], "example": "The stomach churns a meal into a semi-liquid mixture.", "question": "What is one function of stomach acid?", "answer": "It provides an acidic environment for pepsin and helps destroy many swallowed microbes."}, {"chapter": 3, "section": "3.1", "title": "Digestion in the small intestine", "page": "57", "model": "digest", "idea": "Most chemical digestion and absorption happen in the small intestine.", "points": ["Bile emulsifies fats", "Pancreatic and intestinal enzymes act on food", "Villi absorb the products of digestion"], "example": "Fat droplets become smaller when bile emulsifies them, helping lipase work.", "question": "Does bile itself digest fat using an enzyme?", "answer": "No. Bile emulsifies fats, increasing surface area for lipase."}, {"chapter": 3, "section": "3.1", "title": "Large intestine and assimilation", "page": "58", "model": "digest", "idea": "The large intestine absorbs remaining water. Assimilation means using absorbed nutrients in body cells.", "points": ["Water is absorbed in the large intestine", "Glucose may be used for respiration", "Amino acids help make proteins"], "example": "Muscles use absorbed amino acids to build new protein.", "question": "What is assimilation?", "answer": "It is the use or incorporation of absorbed nutrients into body tissues and processes."}, {"chapter": 3, "section": "3.1", "title": "Absorption and villi", "page": "59", "model": "digest", "idea": "Villi are tiny finger-like projections that give the small intestine a very large surface area.", "points": ["Villi have thin walls", "They have many blood capillaries", "Lacteals help absorb the products of fat digestion"], "example": "More folds and villi mean more room to absorb nutrients.", "question": "Why are villi useful?", "answer": "They increase surface area and allow digested nutrients to enter blood or lymph efficiently."}, {"chapter": 3, "section": "3.2", "title": "Blood and its composition", "page": "62", "model": "blood", "idea": "Blood is a transport tissue made of plasma and cells or cell fragments.", "points": ["Plasma carries dissolved substances", "Red blood cells carry oxygen", "White blood cells protect against infection"], "example": "A blood sample separates into plasma and cellular components.", "question": "What carries oxygen in the blood?", "answer": "Red blood cells, using haemoglobin to bind and transport oxygen."}, {"chapter": 3, "section": "3.2", "title": "Plasma, red cells, white cells, platelets", "page": "63", "model": "blood", "idea": "Each main blood component has a different role.", "points": ["Plasma carries substances", "White blood cells take part in defence", "Platelets help blood clot"], "example": "Platelets help reduce bleeding after a minor cut.", "question": "Which part of blood helps form a clot?", "answer": "Platelets, together with clotting proteins and other factors."}, {"chapter": 3, "section": "3.2", "title": "Blood clotting", "page": "67", "model": "blood", "idea": "Blood clotting seals damaged blood vessels to reduce blood loss and help keep microbes out.", "points": ["Platelets gather at the injury", "Clotting reactions form fibrin", "A fibrin mesh traps blood cells"], "example": "A scab forms after a cut as the clot dries.", "question": "What is the function of fibrin?", "answer": "Fibrin forms a mesh that stabilizes the blood clot."}, {"chapter": 3, "section": "3.2", "title": "ABO blood groups and Rhesus factor", "page": "69", "model": "blood", "idea": "Blood groups depend on antigens on red blood cells, including the ABO and Rh systems.", "points": ["Group A has A antigen", "Group B has B antigen", "Rh-positive blood carries the D antigen"], "example": "Blood matching is checked before transfusion.", "question": "Why is blood typing important before transfusion?", "answer": "To help prevent dangerous immune reactions from incompatible blood."}, {"chapter": 3, "section": "3.2", "title": "Safe blood transfusion", "page": "70", "model": "blood", "idea": "A transfusion gives blood or blood components to a patient who needs them.", "points": ["ABO and Rh compatibility matters", "Blood must be screened and cross-matched", "Medical staff choose the appropriate component"], "example": "Hospitals test donor and patient blood before a transfusion.", "question": "Can any blood group safely be given to every patient?", "answer": "No. Compatibility depends on the blood component and medical testing; transfusions require professional matching."}, {"chapter": 3, "section": "3.2", "title": "Exchange at capillaries and tissues", "page": "70", "model": "blood", "idea": "Capillaries have thin walls that help exchange oxygen, nutrients and wastes with tissues.", "points": ["Oxygen moves toward cells that need it", "Waste products enter the blood", "Diffusion occurs across thin capillary walls"], "example": "Oxygen leaves capillaries and reaches working muscle cells.", "question": "Why are capillary walls very thin?", "answer": "They allow short diffusion distances for exchange of substances."}, {"chapter": 3, "section": "3.2", "title": "Lymphatic system", "page": "71", "model": "blood", "idea": "The lymphatic system collects extra tissue fluid and returns it to the blood circulation.", "points": ["Lymph carries excess tissue fluid", "Lymph nodes help immune defence", "Lacteals absorb many digested fats"], "example": "Fluid leaking out of capillaries is collected by lymph vessels.", "question": "What is one major job of lymph vessels?", "answer": "They return excess tissue fluid to the bloodstream."}, {"chapter": 3, "section": "3.3", "title": "Urinary system", "page": "72", "model": "kidney", "idea": "The urinary system helps remove dissolved wastes and control water and salt levels.", "points": ["Kidneys filter the blood", "Ureters carry urine to the bladder", "The urethra carries urine out"], "example": "The kidneys continuously process blood to maintain balance.", "question": "Name the path urine follows after leaving a kidney.", "answer": "Ureter → bladder → urethra."}, {"chapter": 3, "section": "3.3", "title": "The kidney and nephron", "page": "74", "model": "kidney", "idea": "The nephron is the tiny working unit that helps a kidney filter and adjust the fluid that becomes urine.", "points": ["Glomerulus and capsule begin filtration", "Tubules reabsorb useful substances", "The collecting duct carries the remaining fluid"], "example": "Many nephrons work together inside one kidney.", "question": "What is the nephron?", "answer": "The structural and functional unit of a kidney."}, {"chapter": 3, "section": "3.3", "title": "Urine formation", "page": "76", "model": "kidney", "idea": "Urine formation involves filtration, selective reabsorption and secretion.", "points": ["Small molecules pass into the filtrate", "Glucose and much water are reabsorbed normally", "Wastes left behind form urine"], "example": "The body retains useful substances while removing urea.", "question": "Why does healthy urine usually contain little or no glucose?", "answer": "Filtered glucose is normally reabsorbed into the blood by the kidney tubules."}, {"chapter": 3, "section": "3.3", "title": "Osmoregulation", "page": "77", "model": "kidney", "idea": "Osmoregulation keeps the body's water balance within suitable limits.", "points": ["Kidneys adjust water reabsorption", "ADH affects the collecting ducts", "Dehydration generally increases water conservation"], "example": "After drinking much water, urine often becomes more dilute.", "question": "What does ADH help regulate?", "answer": "It increases the kidneys' water reabsorption, helping conserve water."}, {"chapter": 3, "section": "3.3", "title": "Kidney disease, dialysis and other excretory organs", "page": "78", "model": "kidney", "idea": "If kidneys fail, harmful waste can build up. Dialysis can help remove some waste and extra fluid.", "points": ["Dialysis filters blood using a special membrane", "Lungs remove CO₂ and water vapour", "Skin also loses small amounts of waste in sweat"], "example": "Dialysis supports patients whose kidneys cannot filter sufficiently.", "question": "Does dialysis permanently cure kidney failure?", "answer": "No. It replaces some kidney functions, but it is not a cure for the underlying kidney disease."}, {"chapter": 3, "section": "3.4", "title": "Aerobic cellular respiration", "page": "81", "model": "respire", "idea": "Aerobic respiration uses oxygen to release energy from food, producing carbon dioxide and water.", "points": ["Glucose is broken down in stages", "Oxygen is needed at the final electron transport stage", "Cells transfer much of the released energy to ATP"], "example": "Breathing delivers oxygen so cells can keep releasing energy.", "question": "What is the word equation for aerobic respiration?", "answer": "Glucose + oxygen → carbon dioxide + water + energy (transferred into ATP and heat)."}, {"chapter": 3, "section": "3.4", "title": "Glycolysis, Krebs cycle and electron transport", "page": "82", "model": "respire", "idea": "Cells release energy in linked stages: glycolysis, the Krebs cycle and the electron-transport pathway.", "points": ["Glycolysis starts in the cytoplasm", "Later aerobic stages happen in mitochondria", "Electron transport is linked to most ATP production"], "example": "The steps work as an energy-transfer system rather than one sudden burning reaction.", "question": "Where does glycolysis take place?", "answer": "In the cytoplasm (cytosol) of the cell."}, {"chapter": 3, "section": "3.4", "title": "Anaerobic respiration and oxygen debt", "page": "83", "model": "respire", "idea": "When oxygen supply cannot meet demand, muscles can release some ATP through anaerobic pathways.", "points": ["Anaerobic pathways provide less ATP per glucose", "Lactate can build up in working muscles", "Extra oxygen is needed after intense activity as the body recovers"], "example": "A sprint may leave a runner breathing heavily for a while.", "question": "Why does heavy breathing continue after vigorous exercise?", "answer": "The body is recovering from the intense activity, including restoring oxygen and energy stores and processing lactate."}, {"chapter": 4, "section": "4.1", "title": "Nervous system and neurons", "page": "92", "model": "reflex", "idea": "The nervous system sends fast electrical signals between receptors, the brain or spinal cord, and effectors.", "points": ["Sensory neurons carry impulses toward the CNS", "Motor neurons carry impulses to effectors", "Relay neurons connect pathways in the CNS"], "example": "A hand touching a hot surface sends signals toward the spinal cord.", "question": "What carries impulses from a receptor toward the central nervous system?", "answer": "A sensory neuron."}, {"chapter": 4, "section": "4.1", "title": "Receptors and effectors", "page": "93", "model": "reflex", "idea": "A receptor detects a change, and an effector produces a response.", "points": ["The stimulus is a detectable change", "Effectors are muscles or glands", "Signals link detection to response"], "example": "Bright light activates receptors in your eyes.", "question": "Give an example of an effector.", "answer": "A muscle that contracts when it receives a motor signal."}, {"chapter": 4, "section": "4.1", "title": "Organization of the nervous system", "page": "95", "model": "reflex", "idea": "The central nervous system (brain and spinal cord) works with nerves throughout the body.", "points": ["CNS processes information", "Peripheral nerves carry signals", "The autonomic system helps control involuntary functions"], "example": "Your brain coordinates voluntary movement, while some automatic reactions work without conscious choice.", "question": "Which organs make up the central nervous system?", "answer": "The brain and spinal cord."}, {"chapter": 4, "section": "4.1", "title": "Reflexes and the reflex arc", "page": "97", "model": "reflex", "idea": "A reflex is a rapid, automatic response to a stimulus. It can help protect the body.", "points": ["Receptor detects a stimulus", "Sensory neuron sends an impulse to the CNS", "Motor neuron activates an effector"], "example": "You pull your hand away from a sharp object before thinking about it.", "question": "Give the order of a simple reflex arc.", "answer": "Receptor → sensory neuron → relay neuron (in many spinal reflexes) → motor neuron → effector."}, {"chapter": 4, "section": "4.1", "title": "Types of reflexes", "page": "99", "model": "reflex", "idea": "Reflex actions may be innate or acquired through learning.", "points": ["Some reflexes are present from birth", "Conditioned reflexes develop through experience", "Reflexes help coordinate fast responses"], "example": "Blinking to protect the eyes is a common natural reflex.", "question": "Why are protective reflexes useful?", "answer": "They allow quick responses to potentially harmful stimuli."}, {"chapter": 4, "section": "4.2", "title": "Hormones and feedback control", "page": "102", "model": "hormone", "idea": "Hormones are chemical messengers transported through blood. Feedback systems help keep their levels and effects balanced.", "points": ["Endocrine glands release hormones", "Hormones act on target cells", "Negative feedback counteracts large changes"], "example": "Blood glucose control is a familiar feedback system.", "question": "What is negative feedback?", "answer": "A control process in which a response reduces the original change, helping restore normal conditions."}, {"chapter": 4, "section": "4.2", "title": "Insulin and blood glucose", "page": "102", "model": "hormone", "idea": "Insulin helps bring high blood glucose back down by encouraging cells to take up or store glucose.", "points": ["Pancreatic beta cells release insulin", "Insulin promotes glucose uptake or storage", "Glucagon helps increase blood glucose when low"], "example": "After a meal, glucose rises and insulin helps lower it toward the normal range.", "question": "Which hormone helps reduce high blood glucose?", "answer": "Insulin, released by beta cells in the pancreas."}, {"chapter": 4, "section": "4.2", "title": "Diabetes and medical use of hormones", "page": "103", "model": "hormone", "idea": "Diabetes occurs when insulin is lacking, does not work effectively, or both. Care is tailored by healthcare professionals.", "points": ["Insulin treatment is used for some patients", "Hormones can treat certain thyroid disorders", "Hormones must be used under medical advice"], "example": "Some people with diabetes need insulin therapy.", "question": "Can diabetes be diagnosed from one diagram or symptom alone?", "answer": "No. Healthcare professionals use appropriate tests and clinical assessment."}, {"chapter": 4, "section": "4.2", "title": "Anabolic steroids and hormone effects", "page": "104", "model": "hormone", "idea": "Anabolic steroids are synthetic substances related to testosterone. Misuse can harm health.", "points": ["Hormones have wide-ranging effects", "High or inappropriate doses create risks", "Medical use differs from misuse"], "example": "Some medicines use hormones under careful supervision.", "question": "Why is unsupervised steroid use dangerous?", "answer": "It can disrupt natural hormonal control and cause serious health problems."}, {"chapter": 4, "section": "4.3", "title": "Reproductive health and fertility", "page": "107", "model": "repro", "idea": "Reproductive health includes understanding fertility, pregnancy, informed choices and prevention of infections.", "points": ["Ovulation releases an egg", "Fertility depends on several body processes", "Health decisions benefit from accurate information and professional care"], "example": "Family planning helps people make informed decisions about having children.", "question": "What is ovulation?", "answer": "The release of a mature egg from an ovary."}, {"chapter": 4, "section": "4.3", "title": "Birth control and contraception", "page": "108", "model": "repro", "idea": "Different contraceptive methods work in different ways. No method is perfect for everyone.", "points": ["Barrier methods help block sperm", "Hormonal methods can prevent ovulation", "Condoms also reduce the risk of many STIs"], "example": "A healthcare worker can explain different birth-control options.", "question": "Do hormonal contraceptives protect against STIs?", "answer": "No. Hormonal contraception does not protect against sexually transmitted infections."}, {"chapter": 4, "section": "4.3", "title": "Sexually transmitted infections", "page": "110", "model": "repro", "idea": "STIs are infections that can pass through sexual contact. Some are caused by bacteria and others by viruses.", "points": ["Vaccines protect against some infections such as HPV", "Condoms reduce many STI risks", "Testing and professional treatment matter"], "example": "Not all people with an STI have symptoms.", "question": "Why is early testing important?", "answer": "Because infection may occur without obvious symptoms, and timely care can prevent complications and spread."}, {"chapter": 4, "section": "4.3", "title": "Infertility and treatment", "page": "111", "model": "repro", "idea": "Infertility can have different causes. Medical evaluation helps select an appropriate approach.", "points": ["Factors may involve eggs, sperm or reproductive organs", "Hormones may be prescribed in some cases", "Treatment should follow medical advice"], "example": "Doctors may use fertility medications or other treatments depending on the cause.", "question": "Does infertility always have one simple cause?", "answer": "No. Many different factors can contribute, so careful assessment is needed."}, {"chapter": 5, "section": "5.1", "title": "What are micro-organisms?", "page": "120", "model": "microbe", "idea": "Micro-organisms are very small entities or organisms. Some are helpful, while others can cause disease.", "points": ["Many bacteria and fungi are cellular organisms", "Viruses need host cells to reproduce", "Microscopes help us observe tiny structures"], "example": "Yeast makes bread rise, while some microbes cause infections.", "question": "Are all micro-organisms harmful?", "answer": "No. Many help in food production, decomposition and healthy ecosystems."}, {"chapter": 5, "section": "5.1", "title": "Bacteria: shapes and structures", "page": "120", "model": "microbe", "idea": "Bacteria are single-celled prokaryotes. They can be round, rod-shaped or spiral.", "points": ["They lack a membrane-bound nucleus", "Most have a cell wall", "Some have flagella or a capsule"], "example": "Yoghurt production uses helpful bacteria.", "question": "What is the most important difference between bacteria and human cells?", "answer": "Bacteria are prokaryotes, without a membrane-bound nucleus."}, {"chapter": 5, "section": "5.1", "title": "Bacterial nutrition and reproduction", "page": "122", "model": "microbe", "idea": "Bacteria obtain energy and nutrients in different ways and usually reproduce by binary fission.", "points": ["Binary fission produces two daughter cells", "Some bacteria photosynthesize or obtain food from surroundings", "Conditions affect their growth"], "example": "Bacteria may multiply rapidly in suitable food conditions.", "question": "What is binary fission?", "answer": "One bacterial cell copies its DNA and divides into two daughter cells."}, {"chapter": 5, "section": "5.1", "title": "Importance of bacteria", "page": "123", "model": "microbe", "idea": "Some bacteria recycle nutrients, make food or medicines, and live in our bodies; others are pathogens.", "points": ["Decomposers return nutrients to soil", "Useful microbes are used in fermentation", "Pathogenic bacteria cause particular diseases"], "example": "Bacteria help make curd or yoghurt.", "question": "Give one useful role of bacteria.", "answer": "They can carry out fermentation in food-making and help recycle nutrients."}, {"chapter": 5, "section": "5.1", "title": "Viruses and viral reproduction", "page": "124", "model": "microbe", "idea": "A virus contains genetic material inside a protein coat, sometimes with an envelope. It needs a living host cell to reproduce.", "points": ["Viruses do not have normal cellular structures", "They use host-cell machinery to replicate", "Vaccination helps prevent some viral diseases"], "example": "A virus enters a suitable cell to make copies of itself.", "question": "Why do viruses need living host cells?", "answer": "They lack the complete machinery needed to reproduce independently."}, {"chapter": 5, "section": "5.1", "title": "Types of viruses", "page": "125", "model": "microbe", "idea": "Viruses vary in shape, genome and which organisms or cells they infect.", "points": ["Some infect humans and animals", "Some infect plants", "Bacteriophages infect bacteria"], "example": "A bacteriophage targets bacteria rather than humans.", "question": "What is a bacteriophage?", "answer": "A virus that infects bacteria."}, {"chapter": 5, "section": "5.1", "title": "Fungi: structure, reproduction and nutrition", "page": "126", "model": "microbe", "idea": "Fungi include yeast and mould. Many obtain food by absorbing nutrients from their surroundings.", "points": ["Yeast may be single-celled", "Mould is made of hyphae", "Fungi often reproduce by spores"], "example": "Bread mould spreads using spores.", "question": "How do many fungi obtain food?", "answer": "They release enzymes and absorb dissolved nutrients from their surroundings."}, {"chapter": 5, "section": "5.1", "title": "Importance of fungi", "page": "128", "model": "microbe", "idea": "Fungi help break down dead matter and make useful products, but some spoil food or cause disease.", "points": ["Decomposition recycles nutrients", "Yeast is used in baking", "Some fungi cause infections"], "example": "Yeast makes carbon dioxide that helps bread rise.", "question": "Name one useful fungus.", "answer": "Yeast is used in bread-making and some types of fermentation."}, {"chapter": 5, "section": "5.2", "title": "Pathogens and infectious diseases", "page": "130", "model": "microbe", "idea": "A pathogen is a disease-causing biological agent, such as certain bacteria, viruses or fungi.", "points": ["Different pathogens spread in different ways", "Infection prevention reduces risk", "The correct treatment depends on the cause"], "example": "Handwashing reduces transmission of many infectious agents.", "question": "Does an antibiotic cure an ordinary viral cold?", "answer": "No. Antibiotics act against susceptible bacteria, not viruses."}, {"chapter": 5, "section": "5.2", "title": "Immune responses and antibodies", "page": "133", "model": "immune", "idea": "The immune system recognizes threats and responds using cells and molecules, including antibodies.", "points": ["White blood cells help defend the body", "Antibodies bind specific antigens", "Memory cells can support faster future responses"], "example": "The immune system remembers some pathogens after infection or vaccination.", "question": "What is an antibody?", "answer": "A protein made by immune cells that binds to a particular antigen."}, {"chapter": 5, "section": "5.2", "title": "Vaccination and immunization", "page": "134", "model": "immune", "idea": "Vaccination helps the immune system build protection against certain infectious diseases without having to experience the full disease.", "points": ["Vaccines present an antigen or instructions for it", "Immune memory supports future responses", "Public health schedules depend on current guidance"], "example": "Vaccines can help prevent serious forms of infection.", "question": "What is the difference between vaccination and immunization?", "answer": "Vaccination is giving a vaccine; immunization is gaining protection, often through vaccination."}, {"chapter": 5, "section": "5.2", "title": "Medicinal chemicals: antiseptics and antibiotics", "page": "135", "model": "medicines", "idea": "Medicines and disinfecting chemicals have different uses. Safe and correct use is important.", "points": ["Antiseptics are used on living tissue", "Disinfectants are used on surfaces", "Antibiotics treat susceptible bacterial infections"], "example": "Antiseptic may be applied to a small wound following guidance.", "question": "Why should antibiotics not be used without medical advice?", "answer": "Unnecessary or incorrect antibiotic use can cause harm and encourage antibiotic resistance."}, {"chapter": 6, "section": "6.1", "title": "Variation in a population", "page": "144", "model": "variation", "idea": "Variation means differences between individuals of the same species.", "points": ["Some differences are inherited", "Others reflect environmental conditions", "Variation helps populations respond to change"], "example": "People have different heights and blood groups.", "question": "What is variation?", "answer": "Differences in traits among individuals of the same species."}, {"chapter": 6, "section": "6.1", "title": "Continuous and discontinuous variation", "page": "144", "model": "variation", "idea": "Some traits vary along a range, while others occur in distinct categories.", "points": ["Height is commonly continuous variation", "ABO blood group is discontinuous variation", "Environment may influence many continuous traits"], "example": "Height measurements form a range, while blood types have separate categories.", "question": "Give one example of each type.", "answer": "Continuous: height. Discontinuous: ABO blood group."}, {"chapter": 6, "section": "6.1", "title": "Mutation", "page": "146", "model": "variation", "idea": "A mutation is a change in genetic material. Mutations may be harmful, neutral or sometimes beneficial.", "points": ["Mutations can arise during DNA copying", "Some agents increase mutation rates", "Only some mutations can be inherited by offspring"], "example": "A change in a gene may alter a protein.", "question": "Are all mutations harmful?", "answer": "No. Many are neutral; some can be harmful or beneficial."}, {"chapter": 6, "section": "6.1", "title": "Sexual reproduction and recombination", "page": "148", "model": "variation", "idea": "Sexual reproduction creates new combinations of alleles in offspring.", "points": ["Crossing over can exchange DNA", "Independent assortment mixes chromosomes", "Random fertilization increases possible combinations"], "example": "Two siblings may look different even with the same parents.", "question": "Why do siblings differ genetically?", "answer": "They inherit different combinations of alleles because of meiosis and fertilization."}, {"chapter": 6, "section": "6.1", "title": "Hybridization", "page": "149", "model": "variation", "idea": "Hybridization combines genetic material from different varieties or populations, sometimes to develop useful traits.", "points": ["Parents may have different characteristics", "Offspring inherit a mix of traits", "Breeders select desirable combinations"], "example": "A crop breeder crosses varieties to obtain particular features.", "question": "What is a hybrid?", "answer": "An offspring produced from parents with differing genetic lines or varieties."}, {"chapter": 6, "section": "6.2", "title": "Chromosomes, genes and alleles", "page": "150", "model": "dna", "idea": "Chromosomes are long DNA molecules carrying many genes. Alleles are different versions of a gene.", "points": ["Genes contain instructions for traits and cell functions", "Alleles may differ", "Offspring receive genetic information from parents"], "example": "A gene influencing flower colour may have different alleles.", "question": "What is an allele?", "answer": "One of the alternative versions of a gene."}, {"chapter": 6, "section": "6.2", "title": "Mendel's experiments and inheritance", "page": "154", "model": "punnett", "idea": "Mendel studied inherited traits in pea plants and described patterns of dominant and recessive alleles.", "points": ["Offspring receive one allele from each parent", "A dominant allele may mask a recessive one", "Alleles segregate during gamete formation"], "example": "Tall pea plants can carry a recessive allele for shortness.", "question": "What is meant by a recessive allele?", "answer": "It typically appears in the phenotype only when a dominant allele is absent in the simple Mendelian model."}, {"chapter": 6, "section": "6.2", "title": "Monohybrid crosses", "page": "156", "model": "punnett", "idea": "A monohybrid cross follows one characteristic. A Punnett square shows possible allele combinations.", "points": ["Each parent passes one allele in a gamete", "Combine gametes inside a grid", "For Tt × Tt, genotypes occur in a 1:2:1 ratio"], "example": "Two heterozygous tall pea plants can have short offspring.", "question": "What is the phenotype ratio of Tt × Tt under complete dominance?", "answer": "3 tall : 1 short, assuming T is dominant over t."}, {"chapter": 6, "section": "6.2", "title": "Dihybrid crosses", "page": "158", "model": "dihybrid", "idea": "A dihybrid cross follows two characteristics at the same time. Independent assortment can create many combinations.", "points": ["Write each parent's possible gametes", "Combine them in a 4 × 4 grid", "A 9:3:3:1 ratio may occur under particular assumptions"], "example": "A pea cross studies seed shape and seed colour together.", "question": "Does a 9:3:3:1 ratio always occur?", "answer": "No. It requires specific assumptions, including unlinked genes and complete dominance."}, {"chapter": 6, "section": "6.2", "title": "Sex-linked inheritance", "page": "161", "model": "sexlinked", "idea": "Some traits depend on genes located on sex chromosomes, especially the X chromosome.", "points": ["Males commonly have one X chromosome", "X-linked recessive traits can show more often in males", "Inheritance depends on the parents' genotypes"], "example": "Colour vision deficiency can sometimes follow an X-linked pattern.", "question": "Why may an X-linked recessive allele appear in a male with one X chromosome?", "answer": "He generally has no second copy of the gene on another X chromosome to mask it."}, {"chapter": 6, "section": "6.3", "title": "DNA structure", "page": "163", "model": "dna", "idea": "DNA stores genetic information in a double-helix molecule made of nucleotides.", "points": ["DNA has a sugar-phosphate backbone", "Bases pair A with T and C with G", "The sequence of bases carries information"], "example": "Think of the base sequence as a long instruction code.", "question": "Which DNA bases pair with one another?", "answer": "Adenine pairs with thymine, and cytosine pairs with guanine."}, {"chapter": 6, "section": "6.3", "title": "Functions and characteristics of DNA", "page": "164", "model": "dna", "idea": "DNA information can be copied and used to make proteins that help build and regulate cells.", "points": ["DNA stores hereditary instructions", "It is copied before cell division", "Genes guide protein production"], "example": "Cell division requires copying genetic instructions for the new cells.", "question": "Why is DNA copying important?", "answer": "It helps provide genetic information to new daughter cells."}, {"chapter": 6, "section": "6.4", "title": "Evolution and species", "page": "166", "model": "evolution", "idea": "Evolution is change in inherited traits in a population across generations. A species is a group defined by biological or other scientific criteria.", "points": ["Populations can change over time", "Species concepts help categorize organisms", "New species can arise through divergence"], "example": "Populations in different habitats may gradually become different.", "question": "Does an individual organism evolve during its lifetime?", "answer": "Evolution refers to inherited changes in populations over generations, not change in one individual alone."}, {"chapter": 6, "section": "6.4", "title": "Hardy–Weinberg principle", "page": "166", "model": "evolution", "idea": "In an ideal population under specific conditions, allele and genotype frequencies remain constant from one generation to the next.", "points": ["p + q = 1 for two alleles", "p² + 2pq + q² = 1 for genotypes", "The model provides a comparison with real populations"], "example": "If p = 0.6, then q = 0.4; predicted heterozygotes are 2pq = 0.48.", "question": "If p = 0.7, what is q for two alleles?", "answer": "q = 1 − p = 0.3."}, {"chapter": 6, "section": "6.4", "title": "Natural selection and speciation", "page": "167", "model": "evolution", "idea": "Natural selection can make inherited traits that improve reproduction in a particular environment become more common over generations.", "points": ["Variation exists within populations", "Selection affects which traits are passed on", "Different environments can drive divergence"], "example": "In a dark habitat, a well-camouflaged insect might survive predation better.", "question": "What does natural selection act on?", "answer": "Heritable differences affecting survival or reproduction in a particular environment."}, {"chapter": 6, "section": "6.4", "title": "Mutation, genetic drift, isolation and migration", "page": "170", "model": "evolution", "idea": "Several processes influence allele frequencies and whether populations become separate species.", "points": ["Mutation creates new alleles", "Genetic drift is random change, strongest in small populations", "Isolation can reduce gene flow between groups"], "example": "Two populations separated by mountains may gradually diverge.", "question": "What is genetic drift?", "answer": "Random changes in allele frequencies, especially noticeable in small populations."}, {"chapter": 7, "section": "7.1", "title": "Ecosystems: living and nonliving components", "page": "180", "model": "ecosystem", "idea": "An ecosystem includes living organisms and their nonliving surroundings working together.", "points": ["Biotic components are living organisms", "Abiotic components include sunlight, soil, water and air", "Organisms interact with their environment"], "example": "A forest ecosystem includes trees, insects, soil and rainfall.", "question": "Give one biotic and one abiotic factor.", "answer": "Biotic: a tree. Abiotic: sunlight."}, {"chapter": 7, "section": "7.1", "title": "Food chains: grazing and detritus", "page": "182", "model": "ecosystem", "idea": "A food chain shows who transfers energy to whom through eating.", "points": ["A grazing chain begins with producers", "A detritus chain begins with dead organic matter", "Arrows point from food to the organism that eats it"], "example": "Grass → grasshopper → frog → snake.", "question": "What direction do arrows point in a food chain?", "answer": "In the direction of energy transfer, from the organism eaten to the organism eating it."}, {"chapter": 7, "section": "7.1", "title": "Food webs and trophic levels", "page": "183", "model": "ecosystem", "idea": "Several food chains connect to form a food web. Trophic levels describe feeding positions.", "points": ["Producers form the first trophic level", "Consumers occupy higher levels", "Organisms may have more than one food source"], "example": "A bird may eat seeds and insects in the same food web.", "question": "Why is a food web more realistic than one food chain?", "answer": "It shows multiple feeding connections among organisms."}, {"chapter": 7, "section": "7.1", "title": "Energy flow through ecosystems", "page": "184", "model": "ecosystem", "idea": "Energy enters most ecosystems from sunlight and decreases along food chains.", "points": ["Plants capture solar energy", "Energy is transferred by feeding", "Much is used in life processes and released as heat"], "example": "There is usually less energy available to top predators than to producers.", "question": "Why are food chains usually limited in length?", "answer": "Less usable energy is available at each successive trophic level."}, {"chapter": 7, "section": "7.1", "title": "Ecological interdependence and services", "page": "185", "model": "ecosystem", "idea": "Organisms and ecosystems provide services such as pollination, soil formation and water regulation.", "points": ["Pollinators help plants reproduce", "Decomposers recycle nutrients", "Forests support water and soil processes"], "example": "Bees help many flowering plants produce seeds.", "question": "Name one ecosystem service.", "answer": "Pollination, nutrient cycling or water regulation are ecosystem services."}, {"chapter": 7, "section": "7.1", "title": "Positive interactions: mutualism and commensalism", "page": "186", "model": "interaction", "idea": "Some species interactions benefit one or both organisms.", "points": ["Mutualism benefits both partners", "Commensalism benefits one and generally does not affect the other", "Relationships can change with conditions"], "example": "Bees collect nectar and help pollinate flowers.", "question": "What happens in mutualism?", "answer": "Both interacting organisms benefit."}, {"chapter": 7, "section": "7.1", "title": "Negative interactions: predation and parasitism", "page": "187", "model": "interaction", "idea": "Some organisms gain resources by eating or living at the expense of others.", "points": ["Predators catch prey", "Parasites use hosts and may harm them", "These relationships influence populations"], "example": "A hawk catches a smaller bird; a tick feeds on an animal.", "question": "What is the difference between a predator and a parasite?", "answer": "A predator usually kills and eats prey, while a parasite usually lives on or in a host and takes resources over time."}, {"chapter": 7, "section": "7.1", "title": "Competition in ecosystems", "page": "188", "model": "interaction", "idea": "Competition occurs when organisms need the same limited resource.", "points": ["Competition can occur within or between species", "Food, space, light and water can be limited", "Environmental changes can intensify competition"], "example": "Plants growing close together may compete for light.", "question": "Why do plants in a crowded forest compete?", "answer": "They may need the same limited light, water and mineral nutrients."}, {"chapter": 7, "section": "7.2", "title": "Levels of biodiversity", "page": "190", "model": "biodiversity", "idea": "Biodiversity means the variety of life, including differences in genes, species and ecosystems.", "points": ["Genetic diversity exists within species", "Species diversity counts different kinds of organisms", "Ecosystem diversity describes different habitats"], "example": "Bhutan has forests, alpine habitats and many forms of life.", "question": "What are the three commonly discussed levels of biodiversity?", "answer": "Genetic diversity, species diversity and ecosystem diversity."}, {"chapter": 7, "section": "7.2", "title": "Bhutan's biodiversity", "page": "190", "model": "biodiversity", "idea": "Bhutan has rich biodiversity due partly to its wide range of climates, altitudes and habitats.", "points": ["Different elevations create varied habitats", "Forests support many species", "Conservation is important for people and nature"], "example": "Subtropical forests and alpine zones support different communities.", "question": "Why does altitude influence biodiversity in Bhutan?", "answer": "Climate and habitats change with elevation, creating different conditions for different species."}, {"chapter": 7, "section": "7.2", "title": "Importance of biodiversity", "page": "191", "model": "biodiversity", "idea": "Biodiversity supports healthy ecosystems and supplies resources and services people rely on.", "points": ["Species support food webs", "Diverse ecosystems provide useful services", "Biodiversity also has cultural and scientific value"], "example": "Wild plants, crops and pollinators support daily life.", "question": "Give one reason biodiversity matters to people.", "answer": "It supports food production, clean water, ecosystem stability and many other benefits."}, {"chapter": 7, "section": "7.2", "title": "Threats and loss of biodiversity", "page": "193", "model": "biodiversity", "idea": "Habitat change, overexploitation, pollution, climate change and invasive species can reduce biodiversity.", "points": ["Habitat loss removes living space", "Introduced species may compete with native ones", "Extinction means a species has disappeared entirely"], "example": "Cutting a forest into small patches can isolate animal populations.", "question": "Name two major threats to biodiversity.", "answer": "Habitat destruction and invasive species, among others."}, {"chapter": 7, "section": "7.2", "title": "In-situ and ex-situ conservation", "page": "195", "model": "biodiversity", "idea": "Conservation can protect species in their natural habitats or outside those habitats.", "points": ["In-situ means protecting natural ecosystems", "Ex-situ includes seed banks and some captive breeding", "Both methods can support conservation"], "example": "A protected forest is in-situ; a seed bank is ex-situ.", "question": "Which conservation method protects organisms in their natural habitat?", "answer": "In-situ conservation."}, {"chapter": 7, "section": "7.2", "title": "IUCN and threatened species", "page": "197", "model": "biodiversity", "idea": "The IUCN assesses the conservation status of species using evidence-based categories.", "points": ["The Red List describes extinction risk", "Species may be Vulnerable, Endangered or Critically Endangered", "Assessments help guide conservation decisions"], "example": "A threatened species may need habitat protection and monit /* The student modules are fully self-contained. The shared PWA is registered from the portal only. */
window.addEventListener('pageshow',function(){document.documentElement.classList.add('xplat-ready')});
(function(){
'use strict';
let active=null;
function sync(){
  const el=document.querySelector('#diagram') || document.querySelector('.vizstage');
  if(!el || el.dataset.xplatEnlarger==='1') return; el.dataset.xplatEnlarger='1';
  el.classList.add('xplat-diagram-anchor');
  const btn=document.createElement('button');btn.type='button';btn.className='xplat-expand';btn.setAttribute('aria-label','Expand interactive diagram');btn.setAttribute('aria-expanded','false');btn.textContent='⤢ Enlarge diagram';
  function close(){if(!active)return;active.classList.remove('xplat-large');document.body.classList.remove('xplat-model-zoomed');btn.textContent='⤢ Enlarge diagram';btn.setAttribute('aria-expanded','false');btn.classList.remove('xplat-open-button');active=null;}
  btn.addEventListener('click',function(e){e.stopPropagation();if(active){close();return;} active=el;el.classList.add('xplat-large');document.body.classList.add('xplat-model-zoomed');btn.textContent='× Close enlarged diagram';btn.classList.add('xplat-open-button');btn.setAttribute('aria-expanded','true');});
  el.parentNode.insertBefore(btn,el);
  window.addEventListener('keydown',function(e){if(e.key==='Escape')close()});
}
let queued=false;
const obs=new MutationObserver(function(){if(queued)return;queued=true;requestAnimationFrame(function(){queued=false;sync()})});
obs.observe(document.body,{childList:true,subtree:true});
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',sync);else sync();
})();</script></body>
</html>
